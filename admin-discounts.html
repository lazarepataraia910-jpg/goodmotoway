<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap');

  :root {
    --ink: #14171C;
    --paper: #F3F1EB;
    --red: #D8253B;
    --red-dark: #A60F1E;
    --sage: #5F7052;
    --line-light: #E4E1D8;
    --slate: #8A93A0;
    --surface: #ffffff;
    --text: var(--ink);
  }
  :root[data-theme="dark"] {
    --paper: #14171C;
    --surface: #1B1F26;
    --text: #F3F1EB;
    --line-light: #262B33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Noto Sans Georgian', sans-serif; background: var(--paper); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; }
  .display { font-weight: 700; letter-spacing: -0.01em; }
  ::selection { background: rgba(216,37,59,0.22); }

  /* ---- Topbar ---- */
  .topbar {
    background: var(--paper); color: var(--text); padding: 18px 32px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line-light);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-text { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; color: inherit; }
  .brand-text b { color: var(--red); }
  .brand-tag {
    font-weight: 700; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; color: var(--slate); background: var(--surface);
    border: 1px solid var(--line-light); padding: 3px 8px; border-radius: 4px;
  }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- Buttons ---- */
  .btn {
    border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 700;
    font-size: 13.5px; font-family: 'Noto Sans Georgian', sans-serif; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn.red { background: var(--red); color: #fff; }
  .btn.red:hover { background: var(--red-dark); }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn.dark:hover { background: var(--red-dark); }
  .btn.ghost { background: transparent; color: var(--slate); border: 1px solid var(--line-light); }
  .btn.ghost:hover { color: var(--text); border-color: var(--text); }
  .btn.small { padding: 7px 12px; font-size: 12.5px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 32px 60px; }

  /* ---- Admin tabs ---- */
  .admin-tabs {
    max-width: 1180px; margin: 0 auto; padding: 16px 32px 0; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .admin-tab {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line-light); background: var(--surface); color: var(--slate);
    font-size: 13.5px; font-weight: 700; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .admin-tab:hover { color: var(--text); border-color: var(--text); }
  .admin-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .admin-tab .tab-badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff;
    font-size: 11px; display: none; align-items: center; justify-content: center;
  }
  .admin-tab .tab-badge.show { display: inline-flex; }

  /* ---- Login gate ---- */
  .admin-login {
    max-width: 380px; margin: 60px auto; background: var(--surface); color: var(--text);
    border-radius: 16px; padding: 32px 28px; border: 1px solid var(--line-light); text-align: center;
  }
  .admin-login .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; color: var(--red); font-size: 12px;
    font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; margin-bottom: 8px;
  }
  .admin-login .eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--red); display: block; }
  .admin-login h2 { margin: 0 0 20px; font-size: 20px; font-weight: 700; }
  .admin-login .btn.red { width: 100%; padding: 13px; font-size: 14px; }

  .feedback {
    margin-top: 14px; font-size: 12.5px; font-weight: 600; color: var(--red-dark);
    padding: 10px 12px; border-radius: 8px; background: rgba(166,15,30,0.06);
    min-height: 14px; display: none;
  }
  .feedback:not(:empty) { display: block; }
  .feedback.success { color: #3f5836; background: rgba(95,112,82,0.1); }

  /* ---- Form ---- */
  label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--slate); letter-spacing: 0.2px; }
  input, select {
    width: 100%; border: 1px solid var(--line-light); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; color: var(--text); background: var(--surface); transition: border-color 0.2s ease;
    font-family: 'Noto Sans Georgian', sans-serif;
  }
  input:focus, select:focus { outline: none; border-color: var(--text); }
  input.invalid, select.invalid { border-color: var(--red-dark); background: #fdf2f3; }

  .discounts-body { display: none; grid-template-columns: 0.9fr 1.1fr; gap: 20px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line-light); border-radius: 16px; padding: 22px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .panel-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .panel-head .count { font-weight: 700; color: var(--slate); font-size: 13px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  .form-grid .full { grid-column: 1 / -1; }

  .model-picker {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px;
    max-height: 520px; overflow-y: auto; padding: 2px;
    border: 1px solid transparent; border-radius: 12px;
  }
  .model-picker.invalid { border-color: var(--red-dark); padding: 6px; }
  .model-option {
    position: relative; display: flex; flex-direction: column; text-align: left; padding: 0;
    border: 2px solid var(--line-light); border-radius: 12px; overflow: hidden; background: var(--surface);
    color: var(--text); cursor: pointer; font-family: 'Noto Sans Georgian', sans-serif;
    transition: border-color 0.15s ease;
  }
  .model-option:hover { border-color: var(--slate); }
  .model-option.selected { border-color: var(--red); }
  .model-option:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .model-option img, .model-option .mo-noimg {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--paper);
  }
  .model-option .mo-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
  .model-option .mo-name { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
  .model-option .mo-price { font-size: 12px; color: var(--slate); font-weight: 600; }
  .model-option .mo-check {
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--red); color: #fff; font-size: 12px; font-weight: 800;
    display: none; align-items: center; justify-content: center;
  }
  .model-option.selected .mo-check { display: flex; }
  .field-hint { margin-top: 6px; font-size: 12px; color: var(--slate); min-height: 16px; }
  .field-hint b { color: var(--text); }
  .field-hint .save { color: var(--sage); font-weight: 700; }

  .duration-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .duration-chip {
    border: 1px solid var(--line-light); background: var(--surface); color: var(--slate);
    border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans Georgian', sans-serif;
  }
  .duration-chip:hover { color: var(--text); border-color: var(--text); }
  .duration-chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  .form-actions { display: flex; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-light); }

  /* ---- List ---- */
  .discount-list { display: flex; flex-direction: column; gap: 10px; }
  .discount-row {
    border: 1px solid var(--line-light); border-radius: 12px; padding: 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center;
  }
  .discount-row.is-muted { opacity: 0.6; }
  .dr-name { font-weight: 700; font-size: 14.5px; }
  .dr-prices { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .dr-prices s { color: var(--slate); }
  .dr-prices .new { font-weight: 800; font-size: 16px; color: var(--text); }
  .dr-prices .pct { font-weight: 800; font-size: 12px; color: #fff; background: var(--red); padding: 2px 7px; border-radius: 999px; }
  .dr-period { font-size: 12.5px; color: var(--slate); }
  .dr-left { font-size: 12px; font-weight: 700; color: var(--sage); }
  .dr-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .dr-actions { display: flex; gap: 6px; }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .pill-live { background: rgba(95,112,82,0.15); color: var(--sage); }
  .pill-scheduled { background: rgba(216,37,59,0.12); color: var(--red-dark); }
  .pill-expired { background: rgba(138,147,160,0.18); color: var(--slate); }
  .pill-off { background: rgba(20,23,28,0.08); color: var(--slate); }

  .list-empty { color: var(--slate); font-size: 13.5px; padding: 18px 0; text-align: center; }

  .setup-note {
    background: var(--surface); border: 1px solid var(--line-light); border-radius: 16px;
    padding: 24px; color: var(--text); font-size: 13.5px; line-height: 1.7;
  }
  .setup-note h3 { margin: 0 0 10px; font-size: 15px; }
  .setup-note code {
    background: var(--paper); border: 1px solid var(--line-light); border-radius: 6px;
    padding: 2px 6px; font-size: 12.5px;
  }

  @media (max-width: 900px) {
    .discounts-body { grid-template-columns: 1fr; }
  }
  @media (max-width: 800px) {
    .topbar { padding: 16px 20px; }
    .wrap { padding: 24px 20px 60px; }
    .admin-tabs { padding: 16px 20px 0; }
  }
  @media (max-width: 520px) {
    .form-grid { grid-template-columns: 1fr; }
    .discount-row { grid-template-columns: 1fr; }
    .dr-side { align-items: flex-start; }
  }
</style>
<script>
  (function(){try{
    var t = localStorage.getItem('gm_theme');
    // one-time reset: a choice stored before the redesign predates the new
    // default, so clear it once and let the new look through
    if (t && !localStorage.getItem('gm_theme_v2')) { localStorage.removeItem('gm_theme'); t = null; }
    localStorage.setItem('gm_theme_v2', '1');
    var k = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '') || 'index';
    if (t === 'dark') { document.documentElement.setAttribute('data-theme','dark'); }
    else if (!t || t === 'moto') {
      var ml = {'index':1,'product':1,'faq':1,'support':1,'compare':1,'admin':1,'admin-orders':1,'admin-stats':1,'admin-discounts':1,'profile':1};
      if (ml[k]) {
        // paint the dark ground immediately; moto.css still has to come off the
        // network and the page's own <style> would flash light until it lands
        var mcrit = document.createElement('style');
        mcrit.id = 'gmThemeCritical';
        mcrit.textContent = ':root{--ink:#0b0c0e;--paper:#0b0c0e;--surface:#101216;--text:#f2f3f4;--line-light:#1e2126;--red:#e11414;--red-dark:#ff2a2a;--slate:#8b9099;--sage:#9aa2ab}html,body{background:#0b0c0e;color:#f2f3f4}';
        document.head.appendChild(mcrit);
        var mlink = document.createElement('link');
        mlink.id = 'gmClassicTheme'; mlink.rel = 'stylesheet'; mlink.href = 'moto.css';
        document.head.appendChild(mlink);
      }
    }
    else if (t === 'classic') {
      var m = {'index':'classic-index.css','product':'classic-product.css','admin':'classic-admin.css','admin-orders':'classic-admin.css','admin-stats':'classic-admin.css','admin-discounts':'classic-admin.css','faq':'classic-faq.css','support':'classic-support.css','compare':'classic-compare.css'};
      var href = m[k];
      if (href) {
        var l = document.createElement('link');
        l.id = 'gmClassicTheme'; l.rel = 'stylesheet'; l.href = href;
        document.head.appendChild(l);
      }
    }
  }catch(e){}})();
</script>

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function formatPrice(n) { return new Intl.NumberFormat('ka-GE').format(Number(n) || 0); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  // datetime-local wants local wall-clock time without a zone
  function toLocalInput(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function formatWhen(iso) {
    const d = new Date(iso);
    return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function formatSpan(ms) {
    const totalMin = Math.max(0, Math.round(ms / 60000));
    const days = Math.floor(totalMin / 1440);
    const hours = Math.floor((totalMin % 1440) / 60);
    const mins = totalMin % 60;
    if (days > 0) return days + ' დღე' + (hours ? ' ' + hours + ' სთ' : '');
    if (hours > 0) return hours + ' სთ' + (mins ? ' ' + mins + ' წთ' : '');
    return mins + ' წთ';
  }
  function percentOff(oldPrice, newPrice) {
    return oldPrice > 0 ? Math.round((1 - newPrice / oldPrice) * 100) : 0;
  }
  function statusOf(d, now) {
    if (!d.active) return 'off';
    if (now < new Date(d.starts_at)) return 'scheduled';
    if (now >= new Date(d.ends_at)) return 'expired';
    return 'live';
  }
  function setFeedback(id, text, success) {

    el.textContent = text;
  }
  function productById(id) { return PRODUCTS.find((p) => p.id === Number(id)); }

  // A missing table is the one failure the admin can fix without us, so it
  // gets its own instructions instead of a bare error.
  function isMissingTable(error) {
    return !!error && (error.code === '42P01' || error.code === 'PGRST205' || /discounts/.test(error.message || '') && /(does not exist|could not find)/i.test(error.message || ''));
  }
  function renderSetupNote() {
    discountsBody.style.display = 'none';
    setupSlot.innerHTML = `
      <div class="setup-note">
        <h3>ფასდაკლებების ცხრილი ჯერ არ არის შექმნილი</h3>
        <p style="margin:0;color:var(--slate);">გაუშვი <code>supabase/migration_add_discounts.sql</code> Supabase-ის SQL Editor-ში (New query → Run) და გადატვირთე ეს გვერდი.</p>
      </div>`;
  }

  /* ---------- form ---------- */
  function applyDuration() {
    const start = new Date(startInput.value);
    if (isNaN(start)) return;
    const end = new Date(start.getTime() + selectedDays * 86400000);
    endInput.value = toLocalInput(end);
    updateDurationHint();
  }
  function updateDurationHint() {
    const start = new Date(startInput.value);
    const end = new Date(endInput.value);
    const hint = document.getElementById('dDurationHint');
    if (isNaN(start) || isNaN(end)) { hint.textContent = ''; return; }
    if (end <= start) { hint.innerHTML = '<b style="color:var(--red-dark);">დასრულება დაწყებაზე გვიან უნდა იყოს</b>'; return; }
    hint.innerHTML = 'ახალი ფასი იმოქმედებს <b>' + escapeHtml(formatSpan(end - start)) + '</b>';
  }
  function updatePriceHint() {
    const p = productById(selectedProductId);
    const hint = document.getElementById('dPriceHint');
    const val = Number(priceInput.value);
    if (!p || !val) { hint.textContent = ''; return; }
    if (val >= p.price) { hint.innerHTML = '<b style="color:var(--red-dark);">ახალი ფასი ახლანდელზე (' + formatPrice(p.price) + ' ₾) ნაკლები უნდა იყოს</b>'; return; }
    hint.innerHTML = '<span class="save">−' + percentOff(p.price, val) + '%</span> · დაზოგავს ' + formatPrice(p.price - val) + ' ₾';
  }
  function resetForm() {
    priceInput.value = '';
    const now = new Date();
    now.setSeconds(0, 0);
    startInput.value = toLocalInput(now);
    applyDuration();
    updatePriceHint();
    [pickerEl, priceInput, startInput, endInput].forEach((el) => el.classList.remove('invalid'));
  }

  function selectProduct(id) {
    selectedProductId = id;
    pickerEl.querySelectorAll('.model-option').forEach((b) => {
      const on = Number(b.dataset.id) === id;
      b.classList.toggle('selected', on);
      b.setAttribute('aria-checked', on ? 'true' : 'false');
    });
    pickerEl.classList.remove('invalid');
    const p = productById(id);
    document.getElementById('dProductHint').innerHTML = p ? '<b>' + escapeHtml(p.name) + '</b> · ახლანდელი ფასი: <b>' + formatPrice(p.price) + ' ₾</b>' : '';
    updatePriceHint();
  }

  function renderPicker() {
    if (!PRODUCTS.length) { pickerEl.innerHTML = '<div class="list-empty">მოდელები ვერ მოიძებნა</div>'; return; }
    pickerEl.innerHTML = PRODUCTS.map((p) => `
      <button type="button" class="model-option" role="radio" aria-checked="false" data-id="${p.id}">
        <span class="mo-check" aria-hidden="true">✓</span>
        ${p.img ? `<img src="${escapeHtml(p.img)}" alt="" loading="lazy" />` : '<span class="mo-noimg"></span>'}
        <span class="mo-body">
          <span class="mo-name">${escapeHtml(p.name)}</span>
          <span class="mo-price">${formatPrice(p.price)} ₾</span>
        </span>
      </button>`).join('');
    if (selectedProductId) selectProduct(selectedProductId);
  }

  pickerEl.addEventListener('click', (e) => {
    const opt = e.target.closest('.model-option');
    if (opt) selectProduct(Number(opt.dataset.id));
  });
  priceInput.addEventListener('input', updatePriceHint);
  startInput.addEventListener('change', applyDuration);
  endInput.addEventListener('change', () => {
    document.querySelectorAll('.duration-chip').forEach((c) => c.classList.remove('active'));
    updateDurationHint();
  });
  document.getElementById('durationRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.duration-chip');
    if (!chip) return;
    document.querySelectorAll('.duration-chip').forEach((c) => c.classList.toggle('active', c === chip));
    selectedDays = Number(chip.dataset.days);
    applyDuration();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    [pickerEl, priceInput, startInput, endInput].forEach((el) => el.classList.remove('invalid'));

    const p = productById(selectedProductId);
    const price = Number(priceInput.value);
    const start = new Date(startInput.value);
    const end = new Date(endInput.value);

    let firstBad = null;
    const bad = (el, focusEl) => { el.classList.add('invalid'); if (!firstBad) firstBad = focusEl || el; };
    if (!p) bad(pickerEl, pickerEl.querySelector('.model-option'));
    if (!price || price <= 0 || (p && price >= p.price)) bad(priceInput);
    if (isNaN(start)) bad(startInput);
    if (isNaN(end) || (!isNaN(start) && end <= start)) bad(endInput);
    if (firstBad) {
      setFeedback('formFeedback', 'გადაამოწმე მონიშნული ველები');
      firstBad.focus();
      return;
    }

    const submitBtn = document.getElementById('dSubmit');
    submitBtn.disabled = true;
    setFeedback('formFeedback', 'ინახება...');
    const { error } = await supabaseClient.from('discounts').insert({
      product_id: p.id,
      sale_price: price,
      starts_at: start.toISOString(),
      ends_at: end.toISOString(),
      active: true
    });
    submitBtn.disabled = false;

    if (error) {
      console.error('Could not save discount', error);
      if (isMissingTable(error)) { renderSetupNote(); return; }
      setFeedback('formFeedback', 'შენახვა ვერ მოხერხდა: ' + (error.message || ''));
      return;
    }
    setFeedback('formFeedback', 'ფასდაკლება დაემატა ✓', true);
    resetForm();
    await loadDiscounts();
  });

  /* ---------- list ---------- */
  function renderList() {
    const now = new Date();
    document.getElementById('discountCount').textContent = DISCOUNTS.length ? DISCOUNTS.length + ' ჩანაწერი' : '';
    if (!DISCOUNTS.length) {
      listEl.innerHTML = '<div class="list-empty">ფასდაკლებები ჯერ არ არის</div>';
      return;
    }

    // live first, then scheduled, then the rest, newest first inside each group
    const order = { live: 0, scheduled: 1, off: 2, expired: 3 };
    const rows = DISCOUNTS.map((d) => ({ d, status: statusOf(d, now) }))
      .sort((a, b) => (order[a.status] - order[b.status]) || (new Date(b.d.created_at) - new Date(a.d.created_at)));

    listEl.innerHTML = rows.map(({ d, status }) => {
      const p = productById(d.product_id);
      const oldPrice = p ? p.price : null;
      const pct = oldPrice ? percentOff(oldPrice, d.sale_price) : null;
      let when = '';
      if (status === 'live') when = '<span class="dr-left">დარჩა ' + escapeHtml(formatSpan(new Date(d.ends_at) - now)) + '</span>';
      if (status === 'scheduled') when = '<span class="dr-period">დაიწყება ' + escapeHtml(formatSpan(new Date(d.starts_at) - now)) + '-ში</span>';
      return `
        <div class="discount-row${status === 'expired' || status === 'off' ? ' is-muted' : ''}">
          <div>
            <div class="dr-name">${escapeHtml(p ? p.name : 'წაშლილი მოდელი')}</div>
            <div class="dr-prices">
              ${oldPrice ? '<s>' + formatPrice(oldPrice) + ' ₾</s>' : ''}
              <span class="new">${formatPrice(d.sale_price)} ₾</span>
              ${pct !== null && pct > 0 ? '<span class="pct">−' + pct + '%</span>' : ''}
            </div>
            <div class="dr-period">${escapeHtml(formatWhen(d.starts_at))} → ${escapeHtml(formatWhen(d.ends_at))}</div>
            ${when}
          </div>
          <div class="dr-side">
            <span class="pill pill-${status}">${STATUS_LABEL[status]}</span>
            <div class="dr-actions">
              ${status !== 'expired' ? `<button class="btn ghost small" type="button" data-toggle="${d.id}">${d.active ? 'გამორთვა' : 'ჩართვა'}</button>` : ''}
              <button class="btn ghost small" type="button" data-delete="${d.id}">წაშლა</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  listEl.addEventListener('click', async (e) => {
    const toggle = e.target.closest('[data-toggle]');
    const del = e.target.closest('[data-delete]');
    if (toggle) {
      const d = DISCOUNTS.find((x) => x.id === Number(toggle.dataset.toggle));
      if (!d) return;
      toggle.disabled = true;
      const { error } = await supabaseClient.from('discounts').update({ active: !d.active }).eq('id', d.id);
      if (error) {
        console.error('Could not toggle discount', error);
        setFeedback('listFeedback', 'ცვლილება ვერ შეინახა: ' + (error.message || ''));
        toggle.disabled = false;
        return;
      }
      setFeedback('listFeedback', '');
      await loadDiscounts();
    }
    if (del) {
      if (!window.confirm('ნამდვილად გსურთ ამ ფასდაკლების წაშლა?')) return;
      const { error } = await supabaseClient.from('discounts').delete().eq('id', Number(del.dataset.delete));
      if (error) {
        console.error('Could not delete discount', error);
        setFeedback('listFeedback', 'წაშლა ვერ მოხერხდა: ' + (error.message || ''));
        return;
      }
      setFeedback('listFeedback', '');
      await loadDiscounts();
    }
  });

  /* ---------- data ---------- */
  async function loadProducts() {
    const { data, error } = await supabaseClient.from('products').select('id, name, price, img, images').order('name');
    if (error) {
      console.error('Could not load products', error);
      setFeedback('formFeedback', 'მოდელების ჩატვირთვა ვერ მოხერხდა');
      return;
    }
    PRODUCTS = (data || []).map((p) => ({
      id: p.id,
      name: p.name,
      price: Number(p.price) || 0,
      img: (Array.isArray(p.images) && p.images.find(Boolean)) || (typeof p.img === 'string' ? p.img.trim() : '')
    }));
    renderPicker();
  }

  async function loadDiscounts() {
    const { data, error } = await supabaseClient.from('discounts').select('*').order('created_at', { ascending: false });
    if (error) {
      console.error('Could not load discounts', error);
      if (isMissingTable(error)) { renderSetupNote(); return false; }
      setFeedback('listFeedback', 'ფასდაკლებების ჩატვირთვა ვერ მოხერხდა');
      return false;
    }
    DISCOUNTS = data || [];
    renderList();
    return true;
  }

  async function loadNewOrdersBadge() {
    const { count, error } = await supabaseClient
      .from('orders')
      .select('id', { count: 'exact', head: true })
      .eq('status', 'new');
    if (error) return;
    const badge = document.getElementById('newOrdersBadge');
    badge.textContent = count || 0;
    badge.classList.toggle('show', (count || 0) > 0);
  }

  /* ---------- auth gate ---------- */
  async function unlockAdmin() {
    adminLoginBox.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
    setupSlot.innerHTML = '';
    discountsBody.style.display = 'grid';
    loadNewOrdersBadge();
    await loadProducts();
    resetForm();
    await loadDiscounts();
  }

  function isAdminUser(user) {
    return !!user && typeof user.email === 'string' && user.email.toLowerCase() === ADMIN_EMAIL;
  }

  async function checkAdminSession() {
    const { data } = await supabaseClient.auth.getSession();
    const user = data.session && data.session.user;
    if (isAdminUser(user)) {
      unlockAdmin();
      return;
    }
    adminLoginBox.style.display = 'block';
    discountsBody.style.display = 'none';
    setupSlot.innerHTML = '';
    if (user) {
      logoutBtn.style.display = 'inline-block';
      setFeedback('adminFeedback', 'ეს Google ანგარიში არ არის ადმინისტრატორი');
    } else {
      logoutBtn.style.display = 'none';
    }
  }

  // keep the "time left" labels honest while the page stays open
  setInterval(() => { if (DISCOUNTS.length) renderList(); }, 60000);

  document.getElementById('adminGoogleLoginBtn').addEventListener('click', () => {
    supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  });
  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });
  supabaseClient.auth.onAuthStateChange(() => { checkAdminSession(); });
  checkAdminSession();
})();
</script>
</body>
</html>
