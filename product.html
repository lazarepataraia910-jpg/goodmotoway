  :root {

    --paper: #F3F1EB;
    --red: #D8253B;
    --red-dark: #A60F1E;

  :root[data-theme="dark"] {

    --surface: #1B1F26;
    --text: #F3F1EB;
    --line-light: #262B33;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans Georgian', sans-serif; background: var(--paper); color: var(--text); }
  button, a { font-family: 'Noto Sans Georgian', sans-serif; }
  button { cursor: pointer; }
  .display { font-weight: 700; letter-spacing: -0.01em; }
  .icon { width: 15px; height: 15px; display: inline-block; vertical-align: -3px; flex-shrink: 0; }
  a { text-decoration: none; color: inherit; }

  header {
    background: var(--paper); color: var(--text); padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line-light);
  }
  .logo-text { font-size: 18px; letter-spacing: -0.01em; font-weight: 700; }
  .logo-text b { color: var(--red); }
  .header-right-mini { display: flex; align-items: center; gap: 10px; position: relative; }
  .nav-toggle {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;

    background: transparent; color: var(--text);
  }
  .nav-toggle:hover { border-color: var(--text); }
  .nav-toggle .icon { width: 20px; height: 20px; }
  .header-actions {
    display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
    flex-direction: column; align-items: stretch; gap: 4px; min-width: 200px;
    background: var(--surface); border: 1px solid var(--line-light); border-radius: 12px;
    padding: 8px; box-shadow: 0 12px 28px rgba(20,23,28,0.1);
  }
  .header-actions.open { display: flex; }
  .back-link {
    display: flex; align-items: center; gap: 7px; background: transparent;
    color: var(--slate); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-weight: 600;

  .back-link:hover { color: var(--text); background: rgba(20,23,28,0.05); }

  .breadcrumb {
    max-width: 1160px; margin: 24px auto 0; padding: 0 32px; font-size: 13px; color: var(--slate);
    display: flex; align-items: center; gap: 6px;
  }
  .breadcrumb a { color: var(--slate); }
  .breadcrumb a:hover { color: var(--red-dark); }
  .breadcrumb span.current { color: var(--text); font-weight: 600; }

  main { max-width: 1160px; margin: 0 auto; padding: 20px 32px 80px; }

  .detail-card {
    background: var(--surface); border: 1px solid var(--line-light); border-radius: 20px; overflow: hidden;
  }
  .detail-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; }

  .gallery-side { padding: 32px; border-right: 1px solid var(--line-light); }
  .main-image {
    width: 100%; aspect-ratio: 4 / 3; background: #EFECE3; border-radius: 14px; overflow: hidden;
    position: relative; cursor: zoom-in;
  }
  .main-image img {
    width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease;

  .main-image:hover img { transform: scale(1.04); }
  .img-counter {
    position: absolute; bottom: 12px; right: 12px; background: rgba(20,23,28,0.75); color: #fff;
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
  }
  .thumb-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; margin-top: 14px;
  }
  .thumb {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; padding: 0;
    border: 2px solid transparent; background: #EFECE3; transition: 0.15s ease;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb:hover { border-color: var(--line-light); }
  .thumb.active { border-color: var(--red); }

  .info-side { padding: 36px; display: flex; flex-direction: column; }
  .eyebrow-tag {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 6px;

  .stock-tag {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 6px;
    background: var(--paper); color: var(--sage); font-size: 11.5px; font-weight: 700;

  .product-title { font-size: 32px; margin: 0 0 6px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
  .warranty-note { color: var(--sage); font-size: 13px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }

  .color-picker { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .color-picker-label { font-size: 12px; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.4px; }
  .color-picker-label b { color: var(--text); text-transform: none; letter-spacing: normal; }
  .color-swatch-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch-btn {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--line-light);
    cursor: pointer; padding: 0; transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .color-swatch-btn:hover { transform: scale(1.08); }
  .color-swatch-btn.active { box-shadow: 0 0 0 2px var(--red); }

  .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
  .price { font-size: 36px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  .price small { font-size: 13px; color: var(--slate); font-weight: 500; }

  .desc-text { color: var(--slate); font-size: 14.5px; line-height: 1.65; margin-bottom: 22px; white-space: pre-line; }

  .spec-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
    padding: 18px 0; border-top: 1px solid var(--line-light); border-bottom: 1px solid var(--line-light);
    margin-bottom: 24px;

  .spec-item { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--slate); }
  .spec-item svg { margin-top: 2px; color: var(--red-dark); flex-shrink: 0; }
  .sv-label { display: block; color: var(--slate); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px; }
  .sv-value { font-weight: 600; color: var(--text); }

  .cta-row { display: flex; gap: 10px; margin-top: auto; flex-wrap: wrap; }
  .btn-primary {
    flex: 1 1 180px; border: none; background: var(--ink); color: #fff; border-radius: 10px;
    padding: 14px 18px; font-size: 15px; font-weight: 700; transition: background 0.15s ease;
  }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-secondary {
    flex: 1 1 140px; border: 1px solid var(--line-light); background: var(--surface); color: var(--text); border-radius: 10px;
    padding: 14px 18px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-secondary:hover { background: var(--paper); }

  /* empty / not found state */
  .empty-wrap {
    text-align: center; padding: 80px 24px; background: var(--surface); border: 1px solid var(--line-light);
    border-radius: 20px; color: var(--slate);
  }
  .empty-wrap .ok-icon {
    width: 52px; height: 52px; border-radius: 50%; background: var(--paper); color: var(--red-dark);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  .empty-wrap h2 { color: var(--text); font-size: 19px; margin-bottom: 8px; font-weight: 700; }
  .empty-wrap a.btn-primary { display: inline-flex; align-items: center; justify-content: center; margin-top: 16px; text-decoration: none; max-width: 220px; }

  .loading-state { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 80px 24px; color: var(--slate); font-size: 14px; }
  .loading-spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-light); border-top-color: var(--red); animation: gm-spin 0.7s linear infinite; }
  @keyframes gm-spin { to { transform: rotate(360deg); } }

  footer { background: var(--paper); color: var(--slate); padding: 32px 24px; font-size: 13px; text-align: center; margin-top: 48px; border-top: 1px solid var(--line-light); }
  footer b { color: var(--red); }

  @media (max-width: 860px) {
    .detail-grid { grid-template-columns: 1fr; }
    .gallery-side { border-right: none; border-bottom: 1px solid var(--line-light); }
    .product-title { font-size: 26px; }
    .price { font-size: 28px; }
    header { padding: 16px 20px; }

  .whatsapp-float {
    position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: #25D366; display: flex; align-items: center; justify-content: center;

  .whatsapp-float svg { width: 28px; height: 28px; fill: #fff; }
</style>

<script>
(function () {
  const navToggleBtn = document.getElementById('navToggle');
  const navLinksEl = document.getElementById('navLinks');
  navToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = navLinksEl.classList.toggle('open');
    navToggleBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (navLinksEl.classList.contains('open') && !navLinksEl.contains(e.target)) {
      navLinksEl.classList.remove('open');
      navToggleBtn.setAttribute('aria-expanded', 'false');
    }
  });
})();

(async function () {
  const SUPABASE_URL = 'https://lceebrhbvnyzoxkauugo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZWVicmhidm55em94a2F1dWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODkyNzAsImV4cCI6MjEwMTM2NTI3MH0.IeGvLg09wjni7OJdiLeAiO3pvrXxIUgzISNKnVKpXYI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function readQuery() {
    const params = new URLSearchParams(window.location.search);
    return Number(params.get('id'));
  }

  async function loadProduct(id) {
    const { data, error } = await supabaseClient.from('products').select('*').eq('id', id).maybeSingle();
    if (error || !data) return null;
    return normalizeProduct(data);
  }

  function normalizeProduct(row) {
    const images = Array.isArray(row.images) ? row.images.filter(Boolean) : [];
    const fallback = typeof row.img === 'string' ? row.img.trim() : '';
    const merged = images.length > 0 ? images : (fallback ? [fallback] : []);
    return {
      id: row.id,
      key: row.key,
      name: row.name,
      tag: row.tag,
      price: row.price,
      desc: row.description,
      battery: row.battery,
      motor: row.motor,
      speed: row.speed,
      rangeMin: row.range_min,
      rangeMax: row.range_max,
      weight: row.weight,
      brakes: row.brakes,
      tyres: row.tyres,
      dims: row.dims,
      charge: row.charge,
      inStock: row.in_stock !== false,
      img: merged[0] || fallback,
      images: merged,
      colors: Array.isArray(row.colors) ? row.colors : [],
      updatedAt: row.updated_at
    };
  }

  function formatDate(iso) {
    if (!iso) return '';
    try {
      return new Intl.DateTimeFormat('ka-GE', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date(iso));
    } catch (e) {
      return '';
    }
  }

  function formatPrice(n) { return new Intl.NumberFormat('ka-GE').format(n); }

  function specItem(iconPath, label, value) {
    return `<div class="spec-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconPath}</svg>
      <span><span class="sv-label">${label}</span><span class="sv-value">${window.gmEscapeHtml(value)}</span></span>
    </div>`;
  }

  function renderNotFound() {
    document.getElementById('crumbName').textContent = 'ვერ მოიძებნა';
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-wrap">
        <div class="ok-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h2 class="display">პროდუქტი ვერ მოიძებნა</h2>
        <p>შესაძლოა ბმული მოძველებულია, ან პროდუქტი აღარ არის ხელმისაწვდომი.</p>
        <a class="btn-primary" href="index.html">კატალოგზე დაბრუნება</a>
      </div>
    `;
  }

  const productId = readQuery();
  const product = await loadProduct(productId);

  if (!product) {
    renderNotFound();
    return;
  }

  document.title = `${product.name} — GoodMotoway`;
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute('content', `${product.name} — ${product.desc ? product.desc.slice(0, 140) : 'დეტალები, ფოტოები და ფასი GoodMotoway-ზე.'}`);
  document.getElementById('crumbName').textContent = product.name;

  let images = product.images && product.images.length ? product.images : [product.img];
  let activeIndex = 0;
  const esc = window.gmEscapeHtml;

  document.getElementById('mainContent').innerHTML = `
    <div class="detail-card">
      <div class="detail-grid">
        <div class="gallery-side">
          <div class="main-image">
            <img id="mainImage" src="${esc(images[0])}" alt="${esc(product.name)}" />
            <span class="img-counter" id="imgCounter"></span>
          </div>
          <div class="thumb-grid" id="thumbGrid"></div>
        </div>
        <div class="info-side">
          <span class="eyebrow-tag">${esc(product.tag || 'GoodMotoway')}</span>
          <span class="stock-tag ${product.inStock ? '' : 'out'}">${product.inStock ? 'მარაგშია' : 'არ არის მარაგში'}</span>
          <h1 class="product-title display">${esc(product.name)}</h1>
          <div class="warranty-note">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z"/></svg>
            1 წლიანი გარანტია
          </div>
          ${product.updatedAt ? `<div class="last-updated-note">ბოლოს განახლდა: ${esc(formatDate(product.updatedAt))}</div>` : ''}
          ${product.colors && product.colors.length ? `
          <div class="color-picker">
            <span class="color-picker-label">ფერი: <b id="activeColorName">${esc(product.colors[0].name || '')}</b></span>
            <div class="color-swatch-row" id="colorSwatchRow">
              ${product.colors.map((c) => `<button class="color-swatch-btn" type="button" style="background:${esc(c.hex)};" title="${esc(c.name || c.hex)}" aria-label="${esc(c.name || c.hex)}"></button>`).join('')}
            </div>
          </div>` : ''}
          <div class="price-row">
            <span class="price">${formatPrice(product.price)} ₾</span>

          <p class="desc-text">${esc(product.desc || '')}</p>
          <div class="spec-grid">
            ${product.speed ? specItem('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', 'მაქს. სიჩქარე', product.speed + ' კმ/სთ') : ''}
            ${(product.rangeMin && product.rangeMax) ? specItem('<path d="M3 12h18M9 6l-6 6 6 6M15 6l6 6-6 6"/>', 'გარბენი', product.rangeMin + '-' + product.rangeMax + ' კმ') : ''}
            ${product.motor ? specItem('<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>', 'ძრავა', product.motor + 'W') : ''}
            ${product.battery ? specItem('<rect x="3" y="7" width="16" height="10" rx="1"/><line x1="21" y1="10" x2="21" y2="14"/>', 'ბატარეა', product.battery) : ''}
            ${product.brakes ? specItem('<path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z"/>', 'მუხრუჭები', product.brakes) : ''}
            ${product.weight ? specItem('<path d="M6 2h12v6l-3 3 3 3v6H6v-6l3-3-3-3z"/>', 'წონა', product.weight + ' კგ') : ''}
          </div>
          <div class="cta-row">
            <a class="btn-primary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" href="tel:551484883">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>
              551 48 48 83
            </a>
            <button type="button" class="btn-secondary" id="copyLinkBtn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span id="copyLinkLabel">ბმულის კოპირება</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  `;

  const copyLinkBtn = document.getElementById('copyLinkBtn');
  if (copyLinkBtn) {
    copyLinkBtn.addEventListener('click', async () => {
      const label = document.getElementById('copyLinkLabel');
      try {
        await navigator.clipboard.writeText(window.location.href);
        label.textContent = 'დაკოპირდა ✓';
      } catch (e) {
        label.textContent = 'ვერ დაკოპირდა';
      }
      setTimeout(() => { label.textContent = 'ბმულის კოპირება'; }, 2000);
    });
  }

  function renderGallery() {
    const mainImage = document.getElementById('mainImage');
    mainImage.src = images[activeIndex];
    mainImage.alt = product.name;

    const counter = document.getElementById('imgCounter');
    if (counter) counter.textContent = images.length > 1 ? `${activeIndex + 1} / ${images.length}` : '';
    if (counter) counter.style.display = images.length > 1 ? 'block' : 'none';

    const thumbGrid = document.getElementById('thumbGrid');
    if (thumbGrid) {
      thumbGrid.style.display = images.length > 1 ? 'grid' : 'none';
      thumbGrid.innerHTML = images.map((src, index) => `
        <button class="thumb ${index === activeIndex ? 'active' : ''}" type="button" data-index="${index}">
          <img src="${esc(src)}" alt="${esc(product.name)} ${index + 1}" />
        </button>
      `).join('');
      thumbGrid.querySelectorAll('.thumb').forEach(btn => {
        btn.addEventListener('click', () => {
          activeIndex = Number(btn.dataset.index);
          renderGallery();
        });
      });
    }
  }

  function setGallery(newImages) {
    images = newImages && newImages.length ? newImages : [product.img];
    activeIndex = 0;
    renderGallery();
  }

  renderGallery();

  const colorSwatchRow = document.getElementById('colorSwatchRow');
  if (colorSwatchRow) {
    const swatchBtns = colorSwatchRow.querySelectorAll('.color-swatch-btn');
    swatchBtns.forEach((btn, i) => {
      if (i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => {
        swatchBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const color = product.colors[i];
        document.getElementById('activeColorName').textContent = color.name || '';
        const colorImages = color.isBase
          ? (product.images && product.images.length ? product.images : [product.img])
          : (color.images && color.images.length ? color.images : (color.image ? [color.image] : []));
        setGallery(colorImages);
      });
    });
  }
})();
</script>
</body>
</html>
