<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoodMotoway — Product Gallery</title>
  <style>
    :root {
      --ink: #14171C;
      --paper: #f8f5f2;
      --red: #d61f2a;
      --red-dark: #a20f18;
      --line-light: #e8d9db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; background: var(--paper); color: var(--ink);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }
    .topbar {
      background: var(--ink); color: #fff; padding: 14px 24px; display: flex;
      align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-weight: 700; font-size: 20px; }
    .brand b { color: var(--red); }
    .btn {
      border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 700;
      background: var(--red); color: #fff; text-decoration: none;
    }
    .gallery-card {
      background: #fff; border: 1px solid var(--line-light); border-radius: 18px;
      overflow: hidden; box-shadow: 0 12px 26px rgba(15,15,15,0.08);
    }
    .hero {
      display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; padding: 18px;
    }
    .main-image {
      width: 100%; aspect-ratio: 4 / 3; background: #f4efe8; overflow: hidden; border-radius: 14px;
    }
    .main-image img, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px;
      margin-top: 12px;
    }
    .thumb {
      width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--line-light); background: #f4efe8; cursor: pointer;
    }
    .thumb.active { outline: 3px solid rgba(214,31,42,0.65); }
    .info h1 { margin: 0 0 8px; font-size: 32px; }
    .price { color: var(--red-dark); font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    .meta { color: #5b6470; line-height: 1.6; }
    @media (max-width: 880px) {
      .hero { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand">Good<b>Motoway</b></div>
  <a class="btn" href="index.html">საიტზე დაბრუნება</a>
</header>
<div class="wrap">
  <div class="gallery-card">
    <div class="hero">
      <div>
        <div class="main-image"><img id="mainImage" src="" alt="" /></div>
        <div class="thumb-grid" id="thumbGrid"></div>
      </div>
      <div class="info">
        <h1 id="productName">პროდუქტი</h1>
        <div class="price" id="productPrice"></div>
        <div class="meta" id="productDesc"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const STORAGE_KEY = 'goodmotoway_products_v1';
  function readQuery() {
    const params = new URLSearchParams(window.location.search);
    return Number(params.get('id'));
  }
  function loadProducts() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : [];
      }
    } catch (e) {}
    return [];
  }
  function normalizeProduct(product) {
    const images = Array.isArray(product.images) ? product.images.filter(Boolean) : [];
    const fallback = typeof product.img === 'string' ? product.img.trim() : '';
    const merged = images.length > 0 ? images : (fallback ? [fallback] : []);
    return { ...product, img: merged[0] || fallback, images: merged };
  }
  const productId = readQuery();
  const product = loadProducts().map(normalizeProduct).find(item => item.id === productId);
  const mainImage = document.getElementById('mainImage');
  const productName = document.getElementById('productName');
  const productPrice = document.getElementById('productPrice');
  const productDesc = document.getElementById('productDesc');
  const thumbGrid = document.getElementById('thumbGrid');
  if (!product) {
    productName.textContent = 'პროდუქტი ვერ მოიძებნა';
    productDesc.textContent = 'მიუთითეთ სწორი პროდუქტი საიტიდან.';
    return;
  }
  const images = product.images && product.images.length ? product.images : [product.img];
  let activeIndex = 0;
  function renderGallery() {
    mainImage.src = images[activeIndex];
    mainImage.alt = product.name;
    thumbGrid.innerHTML = images.map((src, index) => `
      <button class="thumb ${index === activeIndex ? 'active' : ''}" type="button" data-index="${index}">
        <img src="${src}" alt="${product.name} ${index + 1}" />
      </button>
    `).join('');
    thumbGrid.querySelectorAll('.thumb').forEach(btn => {
      btn.addEventListener('click', () => {
        activeIndex = Number(btn.dataset.index);
        renderGallery();
      });
    });
  }
  productName.textContent = product.name;
  productPrice.textContent = `${product.price} ₾`;
  productDesc.textContent = `${product.desc}\n\nსიჩქარე: ${product.speed} კმ/სთ · ძრავა: ${product.motor}W · გარბენი: ${product.rangeMin}-${product.rangeMax} კმ`;
  renderGallery();
})();
</script>
</body>
</html>
