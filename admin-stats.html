<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap');

  :root {
    --ink: #14171C;
    --paper: #F3F1EB;
    --red: #D8253B;
    --red-dark: #A60F1E;
    --sage: #5F7052;
    --line-light: #E4E1D8;
    --slate: #8A93A0;
    --surface: #ffffff;
    --text: var(--ink);
  }
  :root[data-theme="dark"] {
    --paper: #14171C;
    --surface: #1B1F26;
    --text: #F3F1EB;
    --line-light: #262B33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Noto Sans Georgian', sans-serif; background: var(--paper); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; }
  .display { font-weight: 700; letter-spacing: -0.01em; }
  ::selection { background: rgba(216,37,59,0.22); }

  /* ---- Topbar ---- */
  .topbar {
    background: var(--paper); color: var(--text); padding: 18px 32px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line-light);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-text { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; color: inherit; }
  .brand-text b { color: var(--red); }
  .brand-tag {
    font-weight: 700; font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; color: var(--slate); background: var(--surface);
    border: 1px solid var(--line-light); padding: 3px 8px; border-radius: 4px;
  }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- Buttons ---- */
  .btn {
    border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 700;
    font-size: 13.5px; font-family: 'Noto Sans Georgian', sans-serif; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .btn.red { background: var(--red); color: #fff; }
  .btn.red:hover { background: var(--red-dark); }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn.dark:hover { background: var(--red-dark); }
  .btn.ghost { background: transparent; color: var(--slate); border: 1px solid var(--line-light); }
  .btn.ghost:hover { color: var(--text); border-color: var(--text); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 32px 60px; }

  /* ---- Admin tabs ---- */
  .admin-tabs {
    max-width: 1180px; margin: 0 auto; padding: 16px 32px 0; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .admin-tab {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line-light); background: var(--surface); color: var(--slate);
    font-size: 13.5px; font-weight: 700; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .admin-tab:hover { color: var(--text); border-color: var(--text); }
  .admin-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .admin-tab .tab-badge {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff;
    font-size: 11px; display: none; align-items: center; justify-content: center;
  }
  .admin-tab .tab-badge.show { display: inline-flex; }

  /* ---- Login gate ---- */
  .admin-login {
    max-width: 380px; margin: 60px auto; background: var(--surface); color: var(--text);
    border-radius: 16px; padding: 32px 28px; border: 1px solid var(--line-light); text-align: center;
  }
  .admin-login .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; color: var(--red); font-size: 12px;
    font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; margin-bottom: 8px;
  }
  .admin-login .eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--red); display: block; }
  .admin-login h2 { margin: 0 0 20px; font-size: 20px; font-weight: 700; }
  .admin-login .btn.red { width: 100%; padding: 13px; font-size: 14px; }

  .feedback {
    margin-top: 14px; font-size: 12.5px; font-weight: 600; color: var(--red-dark);
    padding: 10px 12px; border-radius: 8px; background: rgba(166,15,30,0.06);
    min-height: 14px; display: none;
  }
  .feedback:not(:empty) { display: block; }
  .feedback.success { color: #3f5836; background: rgba(95,112,82,0.1); }

  /* ---- Stats workspace ---- */
  .stats-body { display: none; }

  .range-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .range-row .spacer { flex: 1; }
  .range-btn {
    border: 1px solid var(--line-light); background: var(--surface); color: var(--slate);
    border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700;
    font-family: 'Noto Sans Georgian', sans-serif; cursor: pointer;
  }
  .range-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat-card { background: var(--surface); border: 1px solid var(--line-light); border-radius: 14px; padding: 16px 18px; }
  .stat-card .sc-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--slate); }
  .stat-card .sc-value { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -0.01em; }

  .panel { background: var(--surface); border: 1px solid var(--line-light); border-radius: 16px; padding: 22px; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .panel-head h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .panel-head .unit { font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--slate); }

  .chart-panel { margin-bottom: 18px; }
  .chart-wrap { width: 100%; overflow: hidden; }
  .chart-wrap svg { width: 100%; height: 240px; display: block; }
  .chart-grid-line { stroke: var(--line-light); stroke-width: 1; }
  .chart-area { fill: rgba(216,37,59,0.12); }
  .chart-line { fill: none; stroke: var(--red); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-dot { fill: var(--red); }
  .chart-label { fill: var(--slate); font-size: 11px; font-family: 'Noto Sans Georgian', sans-serif; }

  .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; position: relative; }
  .bar-row .bar-track {
    position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 6px;
    background: rgba(216,37,59,0.10); z-index: 0;
  }
  .bar-row .bar-label {
    position: relative; z-index: 1; flex: 1; padding-left: 8px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-row .bar-value { position: relative; z-index: 1; font-weight: 700; padding-right: 6px; }
  .bar-row .bar-pct { position: relative; z-index: 1; color: var(--slate); font-size: 11.5px; min-width: 38px; text-align: right; }
  .panel-empty { color: var(--slate); font-size: 13px; padding: 18px 0; text-align: center; }

  .setup-note {
    background: var(--surface); border: 1px solid var(--line-light); border-radius: 16px;
    padding: 24px; color: var(--text); font-size: 13.5px; line-height: 1.7;
  }
  .setup-note h3 { margin: 0 0 10px; font-size: 15px; }
  .setup-note code {
    background: var(--paper); border: 1px solid var(--line-light); border-radius: 6px;
    padding: 2px 6px; font-size: 12.5px;
  }
  .setup-note ol { margin: 10px 0 0; padding-left: 20px; }
  .setup-note li { margin-bottom: 6px; }

  @media (max-width: 800px) {
    .topbar { padding: 16px 20px; }
    .wrap { padding: 24px 20px 60px; }
    .admin-tabs { padding: 16px 20px 0; }
    .panel-grid { grid-template-columns: 1fr; }
  }
</style>
<script>
  (function(){try{
    var t = localStorage.getItem('gm_theme');
    // one-time reset: a choice stored before the redesign predates the new
    // default, so clear it once and let the new look through
    if (t && !localStorage.getItem('gm_theme_v2')) { localStorage.removeItem('gm_theme'); t = null; }
    localStorage.setItem('gm_theme_v2', '1');
    var k = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '') || 'index';
    if (t === 'dark') { document.documentElement.setAttribute('data-theme','dark'); }
    else if (!t || t === 'moto') {
      var ml = {'index':1,'product':1,'faq':1,'support':1,'compare':1,'admin':1,'admin-orders':1,'admin-stats':1,'profile':1};
      if (ml[k]) {
        // paint the dark ground immediately; moto.css still has to come off the
        // network and the page's own <style> would flash light until it lands
        var mcrit = document.createElement('style');
        mcrit.id = 'gmThemeCritical';
        mcrit.textContent = ':root{--ink:#0b0c0e;--paper:#0b0c0e;--surface:#101216;--text:#f2f3f4;--line-light:#1e2126;--red:#e11414;--red-dark:#ff2a2a;--slate:#8b9099;--sage:#9aa2ab}html,body{background:#0b0c0e;color:#f2f3f4}';
        document.head.appendChild(mcrit);
        var mlink = document.createElement('link');
        mlink.id = 'gmClassicTheme'; mlink.rel = 'stylesheet'; mlink.href = 'moto.css';
        document.head.appendChild(mlink);
      }
    }
    else if (t === 'classic') {
      var m = {'index':'classic-index.css','product':'classic-product.css','admin':'classic-admin.css','admin-orders':'classic-admin.css','admin-stats':'classic-admin.css','faq':'classic-faq.css','support':'classic-support.css','compare':'classic-compare.css'};
      var href = m[k];
      if (href) {
        var l = document.createElement('link');
        l.id = 'gmClassicTheme'; l.rel = 'stylesheet'; l.href = href;
        document.head.appendChild(l);
      }
    }
  }catch(e){}})();
</script>

<script>
(function () {
  const SUPABASE_URL = 'https://lceebrhbvnyzoxkauugo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZWVicmhidm55em94a2F1dWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODkyNzAsImV4cCI6MjEwMTM2NTI3MH0.IeGvLg09wjni7OJdiLeAiO3pvrXxIUgzISNKnVKpXYI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ADMIN_EMAIL = 'lazarepataraia910@gmail.com';

  const COUNTRY_NAME = {
    GE: 'საქართველო', US: 'აშშ', GB: 'დიდი ბრიტანეთი', DE: 'გერმანია', FR: 'საფრანგეთი',
    IT: 'იტალია', ES: 'ესპანეთი', NL: 'ნიდერლანდები', PL: 'პოლონეთი', TR: 'თურქეთი',
    RU: 'რუსეთი', UA: 'უკრაინა', AZ: 'აზერბაიჯანი', AM: 'სომხეთი', CN: 'ჩინეთი',
    IN: 'ინდოეთი', IL: 'ისრაელი', GR: 'საბერძნეთი', CA: 'კანადა', AE: 'არაბთა საამიროები'
  };
  const DEVICE_NAME = { mobile: 'მობილური', desktop: 'დესკტოპი', tablet: 'ტაბლეტი', wearable: 'სამაჯური', console: 'კონსოლი', smarttv: 'სმარტ ტვ' };

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function formatNumber(n) { return new Intl.NumberFormat('ka-GE').format(Number(n) || 0); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function shortDate(iso) {
    const d = new Date(iso);
    return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1);
  }

  let currentDays = 7;

  const adminLoginBox = document.getElementById('adminLoginBox');
  const statsBody = document.getElementById('statsBody');
  const statsContent = document.getElementById('statsContent');
  const adminFeedbackEl = document.getElementById('adminFeedback');
  const statsFeedbackEl = document.getElementById('statsFeedback');
  const logoutBtn = document.getElementById('logoutBtn');

  function setFeedback(el, text, success = false) {
    el.className = 'feedback' + (success ? ' success' : '');
    el.textContent = text;
  }

  function chartSvg(series) {
    if (!series.length) return '<div class="panel-empty">მონაცემები არ არის</div>';

    const width = 900, height = 240;
    const padLeft = 44, padRight = 12, padTop = 14, padBottom = 26;
    const innerW = width - padLeft - padRight;
    const innerH = height - padTop - padBottom;
    const max = Math.max(1, ...series.map((p) => p.visitors));
    const stepX = series.length > 1 ? innerW / (series.length - 1) : 0;
    const x = (i) => padLeft + (series.length > 1 ? i * stepX : innerW / 2);
    const y = (v) => padTop + innerH - (v / max) * innerH;

    const points = series.map((p, i) => [x(i), y(p.visitors)]);
    const line = points.map(([px, py], i) => (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1)).join(' ');
    const area = line + ' L' + x(series.length - 1).toFixed(1) + ' ' + (padTop + innerH) + ' L' + x(0).toFixed(1) + ' ' + (padTop + innerH) + ' Z';

    const gridValues = [0, Math.round(max / 2), max];
    const grid = gridValues.map((value) => {
      const gy = y(value);
      return `<line class="chart-grid-line" x1="${padLeft}" y1="${gy.toFixed(1)}" x2="${width - padRight}" y2="${gy.toFixed(1)}" />
              <text class="chart-label" x="${padLeft - 8}" y="${(gy + 4).toFixed(1)}" text-anchor="end">${formatNumber(value)}</text>`;
    }).join('');

    const labelEvery = Math.max(1, Math.ceil(series.length / 7));
    const xLabels = series.map((p, i) => {
      if (i % labelEvery !== 0 && i !== series.length - 1) return '';
      return `<text class="chart-label" x="${x(i).toFixed(1)}" y="${height - 6}" text-anchor="middle">${escapeHtml(shortDate(p.timestamp))}</text>`;
    }).join('');

    const dots = points.map(([px, py]) => `<circle class="chart-dot" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.5" />`).join('');

    return `<div class="chart-wrap">
      <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="ვიზიტორები დღეების მიხედვით">
        ${grid}
        <path class="chart-area" d="${area}" />
        <path class="chart-line" d="${line}" />
        ${dots}
        ${xLabels}
      </svg>
    </div>`;
  }

  function panelHtml(title, rows, renameFn) {
    const total = rows.reduce((sum, r) => sum + r.pageviews, 0);
    const max = Math.max(1, ...rows.map((r) => r.pageviews));
    const body = rows.length
      ? rows.map((r) => {
          const label = renameFn ? renameFn(r.label) : r.label;
          const pct = total ? Math.round((r.pageviews / total) * 100) : 0;
          return `<div class="bar-row">
            <span class="bar-track" style="width:${((r.pageviews / max) * 100).toFixed(1)}%"></span>
            <span class="bar-label" title="${escapeHtml(label)}">${escapeHtml(label)}</span>
            <span class="bar-value">${formatNumber(r.pageviews)}</span>
            <span class="bar-pct">${pct}%</span>
          </div>`;
        }).join('')
      : '<div class="panel-empty">მონაცემები არ არის</div>';

    return `<div class="panel">
      <div class="panel-head"><h3>${escapeHtml(title)}</h3><span class="unit">ნახვები</span></div>
      ${body}
    </div>`;
  }

  function renderStats(payload) {
    const viewsPerVisitor = payload.totals.visitors
      ? (payload.totals.pageviews / payload.totals.visitors).toFixed(1)
      : '0';

    statsContent.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="sc-label">ვიზიტორები</div><div class="sc-value">${formatNumber(payload.totals.visitors)}</div></div>
        <div class="stat-card"><div class="sc-label">გვერდის ნახვები</div><div class="sc-value">${formatNumber(payload.totals.pageviews)}</div></div>
        <div class="stat-card"><div class="sc-label">ნახვა / ვიზიტორზე</div><div class="sc-value">${escapeHtml(viewsPerVisitor)}</div></div>
      </div>

      <div class="panel chart-panel">
        <div class="panel-head"><h3>ვიზიტორები დღეების მიხედვით</h3><span class="unit">${payload.range.days} დღე</span></div>
        ${chartSvg(payload.series)}
      </div>

      <div class="panel-grid">
        ${panelHtml('გვერდები', payload.pages)}
        ${panelHtml('წყაროები', payload.referrers)}
        ${panelHtml('ქვეყნები', payload.countries, (code) => COUNTRY_NAME[code] || code)}
        ${panelHtml('მოწყობილობები', payload.devices, (d) => DEVICE_NAME[String(d).toLowerCase()] || d)}
        ${panelHtml('ბრაუზერები', payload.browsers)}
        ${panelHtml('ოპერაციული სისტემები', payload.systems)}
      </div>
    `;
  }

  function renderSetupNote() {
    statsContent.innerHTML = `
      <div class="setup-note">
        <h3>სტატისტიკა ჯერ არ არის დაკავშირებული</h3>
        <p style="margin:0;color:var(--slate);">Vercel-ის Web Analytics-ის წასაკითხად სერვერს სჭირდება ტოკენი. დაამატე ეს ცვლადები Vercel-ზე (Project → Settings → Environment Variables) და გააკეთე redeploy:</p>
        <ol>
          <li><code>VERCEL_ANALYTICS_TOKEN</code> — Vercel-ის access token (Account Settings → Tokens)</li>
          <li><code>VERCEL_PROJECT_ID</code> — პროექტის ID (Project → Settings → General)</li>
          <li><code>VERCEL_TEAM_ID</code> — მხოლოდ თუ პროექტი გუნდზეა და არა პირად ანგარიშზე</li>
        </ol>
      </div>
    `;
  }

  async function loadStats() {
    setFeedback(statsFeedbackEl, 'იტვირთება...');
    const { data } = await supabaseClient.auth.getSession();
    const token = data.session && data.session.access_token;
    if (!token) return;

    try {
      const response = await fetch('/api/stats?days=' + currentDays, {
        headers: { Authorization: 'Bearer ' + token }
      });

      if (response.status === 503) {
        renderSetupNote();
        setFeedback(statsFeedbackEl, '');
        return;
      }
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        console.error('Stats request failed', response.status, body);
        // the detail comes from Vercel's own error response and is what tells
        // a wrong token apart from a project the token cannot reach
        const detail = body.message || body.error || '';
        setFeedback(statsFeedbackEl, 'სტატისტიკის წამოღება ვერ მოხერხდა (' + response.status + ')' + (detail ? ' — ' + detail : ''));
        return;
      }

      renderStats(await response.json());
      setFeedback(statsFeedbackEl, '');
    } catch (e) {
      console.error('Stats request failed', e);
      setFeedback(statsFeedbackEl, 'სტატისტიკის წამოღება ვერ მოხერხდა');
    }
  }

  async function loadNewOrdersBadge() {
    const { count, error } = await supabaseClient
      .from('orders')
      .select('id', { count: 'exact', head: true })
      .eq('status', 'new');
    if (error) return;
    const badge = document.getElementById('newOrdersBadge');
    badge.textContent = count || 0;
    badge.classList.toggle('show', (count || 0) > 0);
  }

  document.querySelectorAll('.range-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentDays = Number(btn.dataset.days);
      loadStats();
    });
  });
  document.getElementById('refreshBtn').addEventListener('click', loadStats);

  async function unlockAdmin() {
    adminLoginBox.style.display = 'none';
    statsBody.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    loadNewOrdersBadge();
    loadStats();
  }

  function isAdminUser(user) {
    return !!user && typeof user.email === 'string' && user.email.toLowerCase() === ADMIN_EMAIL;
  }

  async function checkAdminSession() {
    const { data } = await supabaseClient.auth.getSession();
    const user = data.session && data.session.user;
    if (isAdminUser(user)) {
      unlockAdmin();
      return;
    }
    adminLoginBox.style.display = 'block';
    statsBody.style.display = 'none';
    statsContent.innerHTML = '';
    if (user) {
      logoutBtn.style.display = 'inline-block';
      setFeedback(adminFeedbackEl, 'ეს Google ანგარიში არ არის ადმინისტრატორი');
    } else {
      logoutBtn.style.display = 'none';
    }
  }

  document.getElementById('adminGoogleLoginBtn').addEventListener('click', () => {
    supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  });
  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });
  supabaseClient.auth.onAuthStateChange(() => { checkAdminSession(); });
  checkAdminSession();
})();
</script>
</body>
</html>
