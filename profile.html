<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap');

  :root {
    --ink: #14171C;
    --paper: #F3F1EB;
    --red: #D8253B;
    --red-dark: #A60F1E;
    --sage: #5F7052;
    --line-light: #E4E1D8;
    --slate: #8A93A0;
    --surface: #ffffff;
    --text: var(--ink);
  }
  :root[data-theme="dark"] {
    --paper: #14171C;
    --surface: #1B1F26;
    --text: #F3F1EB;
    --line-light: #262B33;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans Georgian', sans-serif; background: var(--paper); color: var(--text); transition: background 0.2s ease, color 0.2s ease; }
  a { text-decoration: none; color: inherit; }
  button { font-family: 'Noto Sans Georgian', sans-serif; cursor: pointer; }
  .display { font-weight: 700; letter-spacing: -0.01em; }
  .icon { width: 15px; height: 15px; display: inline-block; vertical-align: -3px; flex-shrink: 0; }

  header {
    background: var(--paper); color: var(--text); padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line-light);
  }
  .logo-text { font-size: 18px; letter-spacing: -0.01em; font-weight: 700; }
  .logo-text b { color: var(--red); }
  .header-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .back-link {
    display: flex; align-items: center; gap: 7px; background: transparent;
    color: var(--slate); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-weight: 600;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .back-link:hover { color: var(--text); background: rgba(128,128,128,0.1); }

  main { max-width: 640px; margin: 0 auto; padding: 44px 32px 80px; }
  h1.display { font-size: 28px; margin: 0 0 8px; }
  .lead { color: var(--slate); font-size: 14.5px; margin: 0 0 32px; }

  .profile-card {
    background: var(--surface); border: 1px solid var(--line-light); border-radius: 16px; padding: 24px;
    display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
  }
  .profile-card img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .profile-card .pc-name { font-weight: 700; font-size: 16px; }
  .profile-card .pc-email { color: var(--slate); font-size: 13px; margin-top: 2px; }

  .section-card {
    background: var(--surface); border: 1px solid var(--line-light); border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .section-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
  .section-card .sc-sub { color: var(--slate); font-size: 13px; margin-bottom: 18px; }

  .theme-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .theme-option {
    border: 2px solid var(--line-light); border-radius: 12px; padding: 16px; text-align: left;
    background: var(--paper); display: flex; flex-direction: column; gap: 10px; transition: border-color 0.15s ease;
  }
  .theme-option:hover { border-color: var(--slate); }
  .theme-option.active { border-color: var(--red); }
  .theme-preview { width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--line-light); }
  .theme-preview.light-preview { background: linear-gradient(135deg, #F3F1EB 60%, #ffffff 60%); }
  .theme-preview.dark-preview { background: linear-gradient(135deg, #14171C 60%, #1B1F26 60%); }
  .theme-preview.classic-preview { background: linear-gradient(135deg, #14171C 55%, #D8253B 55%); }
  .theme-option .to-label { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
  .theme-option .to-check { color: var(--red); display: none; }
  .theme-option.active .to-check { display: inline; }

  .theme-save-row { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .btn-save-theme {
    border: none; background: var(--ink); color: #fff; border-radius: 10px;
    padding: 12px 20px; font-size: 14px; font-weight: 700; transition: background 0.15s ease;
  }
  .btn-save-theme:hover { background: var(--red-dark); }
  .btn-save-theme:disabled { opacity: 0.6; cursor: default; }
  .save-feedback {
    font-size: 13px; font-weight: 700; color: var(--sage); opacity: 0; transition: opacity 0.2s ease;
  }
  .save-feedback.show { opacity: 1; }
  .save-feedback.error { color: var(--red-dark); }

  .signout-btn {
    border: 1px solid var(--line-light); background: var(--surface); color: var(--red-dark);
    border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700;
  }
  .signout-btn:hover { background: var(--paper); }

  .empty-wrap {
    text-align: center; padding: 60px 24px; background: var(--surface); border: 1px solid var(--line-light);
    border-radius: 18px; color: var(--slate);
  }
  .empty-wrap h2 { color: var(--text); font-size: 19px; margin-bottom: 10px; font-weight: 700; }
  .empty-wrap .gm-login-cta { margin-top: 18px; display: inline-flex; }

  footer { background: var(--paper); color: var(--slate); padding: 32px 24px; font-size: 13px; text-align: center; margin-top: 48px; border-top: 1px solid var(--line-light); }
  footer b { color: var(--red); }

  .whatsapp-float {
    position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: #25D366; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(37,211,102,0.3); z-index: 50; transition: transform 0.15s ease;
  }
  .whatsapp-float:hover { transform: scale(1.05); }
  .whatsapp-float svg { width: 28px; height: 28px; fill: #fff; }

  @media (max-width: 560px) {
    header { padding: 16px 20px; }
    main { padding: 32px 20px 60px; }
    .profile-card { flex-direction: column; text-align: center; }
    .theme-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  function renderLoggedIn(user, theme) {
    const name = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || user.email || 'მომხმარებელი';
    const avatar = user.user_metadata && user.user_metadata.avatar_url;
    const email = user.email || '';

    document.getElementById('profileContent').innerHTML = `
      <div class="profile-card">
        ${avatar ? `<img src="${avatar}" alt="" />` : ''}
        <div>
          <div class="pc-name">${name}</div>
          <div class="pc-email">${email}</div>
        </div>
      </div>

      <div class="section-card">
        <h3>დიზაინის რეჟიმი</h3>
        <div class="sc-sub">აირჩიე დიზაინის რეჟიმი — შენახება ხდება შენს პროფილში, ყველა მოწყობილობაზე გამოჩნდება.</div>
        <div class="theme-grid" id="themeGrid">
          <button type="button" class="theme-option" data-theme-choice="light">
            <div class="theme-preview light-preview"></div>
            <span class="to-label"><span class="to-check">✓</span> ღია</span>
          </button>
          <button type="button" class="theme-option" data-theme-choice="dark">
            <div class="theme-preview dark-preview"></div>
            <span class="to-label"><span class="to-check">✓</span> მუქი</span>
          </button>
          <button type="button" class="theme-option" data-theme-choice="classic">
            <div class="theme-preview classic-preview"></div>
            <span class="to-label"><span class="to-check">✓</span> დიფოლტი</span>
          </button>
        </div>
        <div class="theme-save-row">
          <button type="button" class="btn-save-theme" id="saveThemeBtn">შენახვა</button>
          <span class="save-feedback" id="saveThemeFeedback">შენახულია ✓</span>
        </div>
      </div>

      <button type="button" class="signout-btn" id="signOutBtn">გასვლა</button>
    `;

    function markActive(theme) {
      document.querySelectorAll('.theme-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeChoice === theme);
      });
    }
    markActive(theme);

    document.querySelectorAll('.theme-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const choice = btn.dataset.themeChoice;
        markActive(choice);
        window.gmApplyTheme(choice);
      });
    });

    const saveBtn = document.getElementById('saveThemeBtn');
    const saveFeedback = document.getElementById('saveThemeFeedback');
    let saveFeedbackTimer = null;
    saveBtn.addEventListener('click', async () => {
      const active = document.querySelector('.theme-option.active');
      const choice = active ? active.dataset.themeChoice : 'light';
      saveBtn.disabled = true;
      saveBtn.textContent = 'ინახება...';
      const { error } = await window.gmAuthClient.from('profiles').update({ theme: choice, updated_at: new Date().toISOString() }).eq('id', user.id);
      saveBtn.disabled = false;
      saveBtn.textContent = 'შენახვა';
      if (error) {
        console.error('Failed to save theme', error);
        saveFeedback.textContent = 'შენახვა ვერ მოხერხდა — სცადე თავიდან';
        saveFeedback.classList.add('show', 'error');
      } else {
        saveFeedback.textContent = 'შენახულია ✓';
        saveFeedback.classList.remove('error');
        saveFeedback.classList.add('show');
      }
      clearTimeout(saveFeedbackTimer);
      saveFeedbackTimer = setTimeout(() => saveFeedback.classList.remove('show'), 2200);
    });

    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await window.gmAuthClient.auth.signOut();
      window.location.reload();
    });
  }

  function renderLoginCta() {
    const cta = document.getElementById('loginCta');
    if (!cta) return;
    cta.innerHTML = `
      <button type="button" class="auth-chip auth-login-btn" id="profileGoogleLoginBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.4C.5 8.3 0 10.1 0 12s.5 3.7 1.4 5.4l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l4 3.1c.9-2.8 3.5-4.9 6.6-4.9z"/></svg>
        შესვლა
      </button>
    `;
    document.getElementById('profileGoogleLoginBtn').addEventListener('click', () => {
      window.gmAuthClient.auth.signInWithOAuth({ provider: 'google' });
    });
  }

  renderLoginCta();

  async function checkSession() {
    const { data } = await window.gmAuthClient.auth.getSession();
    const user = data.session && data.session.user;
    if (user) {
      const { data: profile } = await window.gmAuthClient.from('profiles').select('theme').eq('id', user.id).maybeSingle();
      renderLoggedIn(user, (profile && profile.theme) || 'light');
    }
  }

  checkSession();
  window.gmAuthClient.auth.onAuthStateChange(() => checkSession());
})();
</script>
</body>
