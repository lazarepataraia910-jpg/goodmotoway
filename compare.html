<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap');

  :root {
    --ink: #14171C;
    --paper: #F3F1EB;
    --red: #D8253B;
    --red-dark: #A60F1E;
    --sage: #5F7052;
    --line-light: #E4E1D8;
    --slate: #8A93A0;
    --surface: #ffffff;
    --text: var(--ink);
  }
  :root[data-theme="dark"] {
    --paper: #14171C;
    --surface: #1B1F26;
    --text: #F3F1EB;
    --line-light: #262B33;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans Georgian', sans-serif; background: var(--paper); color: var(--text); }
  a { text-decoration: none; color: inherit; }
  button { font-family: 'Noto Sans Georgian', sans-serif; cursor: pointer; }
  .display { font-weight: 700; letter-spacing: -0.01em; }
  .icon { width: 15px; height: 15px; display: inline-block; vertical-align: -3px; flex-shrink: 0; }

  header {
    background: var(--paper); color: var(--text); padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line-light);
  }
  .logo-text { font-size: 18px; letter-spacing: -0.01em; font-weight: 700; }
  .logo-text b { color: var(--red); }
  .header-right-mini { display: flex; align-items: center; gap: 10px; position: relative; }
  .nav-toggle {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-light);
    background: transparent; color: var(--text);
  }
  .nav-toggle:hover { border-color: var(--text); }
  .nav-toggle .icon { width: 20px; height: 20px; }
  .header-actions {
    display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
    flex-direction: column; align-items: stretch; gap: 4px; min-width: 200px;
    background: var(--surface); border: 1px solid var(--line-light); border-radius: 12px;
    padding: 8px; box-shadow: 0 12px 28px rgba(20,23,28,0.1);
  }
  .header-actions.open { display: flex; }
  .back-link {
    display: flex; align-items: center; gap: 7px; background: transparent;
    color: var(--slate); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; font-weight: 600;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .back-link:hover { color: var(--text); background: rgba(20,23,28,0.05); }

  main { max-width: 1000px; margin: 0 auto; padding: 44px 32px 80px; }
  h1.display { font-size: 30px; margin: 0 0 8px; }
  .lead { color: var(--slate); font-size: 14.5px; margin: 0 0 32px; }

  .step { display: none; }
  .step.active { display: block; }

  .loading-note { color: var(--slate); font-size: 14px; padding: 20px 0; }

  .count-grid { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .count-card {
    flex: 1 1 140px; background: var(--surface); border: 1.5px solid var(--line-light); border-radius: 16px;
    padding: 32px 20px; text-align: center; transition: border-color 0.2s ease;
  }
  .count-card:hover { border-color: var(--text); }
  .count-card .num { font-weight: 700; font-size: 40px; color: var(--text); line-height: 1; }
  .count-card .lbl { font-size: 13px; color: var(--slate); font-weight: 600; margin-top: 8px; }

  .mini-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line-light);
    color: var(--text); border-radius: 8px; padding: 9px 14px; font-size: 13.5px; font-weight: 700;
  }
  .mini-btn:hover { border-color: var(--text); }

  .step-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .select-counter { font-size: 13px; font-weight: 700; color: var(--red-dark); background: var(--paper); padding: 6px 12px; border-radius: 999px; }

  .model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .model-card {
    background: var(--surface); border: 2px solid var(--line-light); border-radius: 14px; overflow: hidden;
    transition: border-color 0.2s ease; position: relative; padding: 0; text-align: left;
  }
  .model-card.selected { border-color: var(--red); }
  .model-card:disabled { opacity: 0.4; cursor: not-allowed; }
  .model-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #EFECE3; }
  .model-card .mc-body { padding: 10px 12px; }
  .model-card .mc-name { font-weight: 700; font-size: 13.5px; }
  .model-card .mc-price { color: var(--red-dark); font-weight: 700; font-size: 13px; margin-top: 2px; }
  .model-card .check {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface);
    border: 2px solid var(--line-light); display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700;
  }
  .model-card.selected .check { background: var(--red); border-color: var(--red); }

  .compare-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .btn-primary {
    border: none; background: var(--ink); color: #fff; border-radius: 10px;
    padding: 13px 22px; font-size: 14.5px; font-weight: 700; transition: background 0.2s ease;
  }
  .btn-primary:hover:not(:disabled) { background: var(--red-dark); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .compare-table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line-light); background: var(--surface); }
  table.compare-table { border-collapse: collapse; width: 100%; min-width: 560px; }
  .compare-table th, .compare-table td { padding: 14px 16px; border-bottom: 1px solid var(--line-light); text-align: left; font-size: 13.5px; vertical-align: top; }
  .compare-table tbody tr:last-child td { border-bottom: none; }
  .compare-table th.spec-col, .compare-table td.spec-col {
    position: sticky; left: 0; background: var(--surface); font-weight: 700; color: var(--slate);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
  }
  .compare-table thead th { background: var(--paper); }
  .compare-table thead th.spec-col { background: var(--paper); }
  .compare-col-head { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; min-width: 150px; }
  .compare-col-head img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: #EFECE3; }
  .compare-col-head .cc-name { font-weight: 700; font-size: 14px; }
  .compare-col-head .cc-price { color: var(--red-dark); font-weight: 700; font-size: 16px; }
  .compare-col-head a { font-size: 12px; color: var(--red-dark); font-weight: 700; }
  .compare-col-head a:hover { color: var(--text); }

  footer { background: var(--paper); color: var(--slate); padding: 32px 24px; font-size: 13px; text-align: center; margin-top: 48px; border-top: 1px solid var(--line-light); }
  footer b { color: var(--red); }

  .whatsapp-float {
    position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: #25D366; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(37,211,102,0.3); z-index: 50; transition: transform 0.15s ease;
  }
  .whatsapp-float:hover { transform: scale(1.05); }
  .whatsapp-float svg { width: 28px; height: 28px; fill: #fff; }

  @media (max-width: 600px) {
    header { padding: 16px 20px; }
    main { padding: 32px 20px 60px; }
  }
</style>

<script>
(function () {
  const navToggleBtn = document.getElementById('navToggle');
  const navLinksEl = document.getElementById('navLinks');
  navToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = navLinksEl.classList.toggle('open');
    navToggleBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', (e) => {
    if (navLinksEl.classList.contains('open') && !navLinksEl.contains(e.target)) {
      navLinksEl.classList.remove('open');
      navToggleBtn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
(async function () {
  const SUPABASE_URL = 'https://lceebrhbvnyzoxkauugo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZWVicmhidm55em94a2F1dWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODkyNzAsImV4cCI6MjEwMTM2NTI3MH0.IeGvLg09wjni7OJdiLeAiO3pvrXxIUgzISNKnVKpXYI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function normalizeProduct(row) {
    const images = Array.isArray(row.images) ? row.images.filter(Boolean) : [];
    const fallbackImage = typeof row.img === 'string' ? row.img.trim() : '';
    return {
      id: row.id,
      name: row.name,
      tag: row.tag,
      price: row.price,
      battery: row.battery,
      motor: row.motor,
      speed: row.speed,
      rangeMin: row.range_min,
      rangeMax: row.range_max,
      weight: row.weight,
      brakes: row.brakes,
      tyres: row.tyres,
      dims: row.dims,
      inStock: row.in_stock !== false,
      img: images[0] || fallbackImage
    };
  }

  async function loadProducts() {
    const { data, error } = await supabaseClient.from('products').select('*').order('id');
    if (error) {
      console.error('Could not load products', error);
      return [];
    }
    return data.map(normalizeProduct);
  }

  function formatPrice(n) { return new Intl.NumberFormat('ka-GE').format(n); }

  let PRODUCTS = [];
  let targetCount = 0;
  let selected = [];

  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const step3 = document.getElementById('step3');
  const loadingNote = document.getElementById('loadingNote');
  const countGrid = document.getElementById('countGrid');
  const modelGrid = document.getElementById('modelGrid');
  const selectCounter = document.getElementById('selectCounter');
  const compareBtn = document.getElementById('compareBtn');
  const backToStep1Btn = document.getElementById('backToStep1');
  const restartBtn = document.getElementById('restartBtn');
  const compareTableWrap = document.getElementById('compareTableWrap');

  function showStep(n) {
    [step1, step2, step3].forEach((el, i) => el.classList.toggle('active', i === n - 1));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderCountOptions() {
    const options = [2, 3, 4].filter(n => n <= PRODUCTS.length);
    if (options.length === 0) {
      loadingNote.textContent = 'შედარებისთვის საჭიროა მინიმუმ 2 მოდელი კატალოგში.';
      return;
    }
    loadingNote.style.display = 'none';
    countGrid.style.display = 'flex';
    countGrid.innerHTML = options.map(n => `
      <button class="count-card" type="button" data-count="${n}">
        <div class="num">${n}</div>
        <div class="lbl">მოდელი</div>
      </button>
    `).join('');
    countGrid.querySelectorAll('.count-card').forEach(card => {
      card.addEventListener('click', () => {
        targetCount = Number(card.dataset.count);
        selected = [];
        renderModelGrid();
        showStep(2);
      });
    });
  }

  function renderModelGrid() {
    selectCounter.textContent = `არჩეულია ${selected.length} / ${targetCount}`;
    modelGrid.innerHTML = PRODUCTS.map(p => {
      const isSelected = selected.includes(p.id);
      const isDisabled = !isSelected && selected.length >= targetCount;
      const esc = window.gmEscapeHtml;
      return `
        <button type="button" class="model-card ${isSelected ? 'selected' : ''}" data-id="${p.id}" ${isDisabled ? 'disabled' : ''}>
          <span class="check">${isSelected ? '✓' : ''}</span>
          <img src="${esc(p.img)}" alt="${esc(p.name)}" />
          <div class="mc-body">
            <div class="mc-name">${esc(p.name)}</div>
            <div class="mc-price">${formatPrice(p.price)} ₾</div>
          </div>
        </button>
      `;
    }).join('');
    modelGrid.querySelectorAll('.model-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.id);
        if (selected.includes(id)) {
          selected = selected.filter(x => x !== id);
        } else if (selected.length < targetCount) {
          selected.push(id);
        }
        renderModelGrid();
      });
    });
    compareBtn.disabled = selected.length !== targetCount;
  }

  backToStep1Btn.addEventListener('click', () => showStep(1));

  compareBtn.addEventListener('click', () => {
    renderComparison();
    showStep(3);
  });

  restartBtn.addEventListener('click', () => {
    targetCount = 0;
    selected = [];
    showStep(1);
  });

  const SPEC_ROWS = [
    { label: 'ფასი', fn: p => formatPrice(p.price) + ' ₾' },
    { label: 'მარაგი', fn: p => p.inStock ? 'მარაგშია' : 'არ არის მარაგში' },
    { label: 'მაქს. სიჩქარე', fn: p => p.speed ? p.speed + ' კმ/სთ' : '—' },
    { label: 'გარბენი', fn: p => (p.rangeMin && p.rangeMax) ? p.rangeMin + '-' + p.rangeMax + ' კმ' : '—' },
    { label: 'ძრავა', fn: p => p.motor ? p.motor + 'W' : '—' },
    { label: 'ბატარეა', fn: p => p.battery || '—' },
    { label: 'საბურავი', fn: p => p.tyres || '—' },
    { label: 'მუხრუჭები', fn: p => p.brakes || '—' },
    { label: 'გაბარიტები', fn: p => p.dims || '—' },
    { label: 'წონა', fn: p => p.weight ? p.weight + ' კგ' : '—' }
  ];

  function renderComparison() {
    const chosen = selected.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
    const esc = window.gmEscapeHtml;
    compareTableWrap.innerHTML = `
      <table class="compare-table">
        <thead>
          <tr>
            <th class="spec-col"></th>
            ${chosen.map(p => `
              <th>
                <div class="compare-col-head">
                  <img src="${esc(p.img)}" alt="${esc(p.name)}" />
                  <span class="cc-name">${esc(p.name)}</span>
                  <span class="cc-price">${formatPrice(p.price)} ₾</span>
                  <a href="product.html?id=${p.id}">დეტალურად →</a>
                </div>
              </th>
            `).join('')}
          </tr>
        </thead>
        <tbody>
          ${SPEC_ROWS.map(row => `
            <tr>
              <td class="spec-col">${row.label}</td>
              ${chosen.map(p => `<td>${esc(row.fn(p))}</td>`).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  PRODUCTS = await loadProducts();
  renderCountOptions();
})();
</script>
